# Dit à GitHub Actions comment lancer la veille.
# Deux déclencheurs : chaque matin tout seul, et à la main depuis l'onglet "Actions".
name: Veille des levées

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 4 h 47 en temps universel : 6 h 47 à Paris en été, 5 h 47 en hiver.
    # Les 5 champs se lisent : minute, heure, jour du mois, mois, jour de la semaine.
    - cron: "47 4 * * *"

# Autorise ce lancement à enregistrer le résultat dans le repo.
permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du repo
        uses: actions/checkout@v7

      - name: Vérifier le script (tests)
        run: python3 -m unittest discover tests

      - name: Interroger l'API et écrire data/levees.json
        run: python3 veille.py

      - name: Enregistrer le résultat dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/levees.json
          git diff --cached --quiet || git commit -m "Mise à jour des levées"
          git push
